<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>مندوب الأدوية</title>
<meta name="theme-color" content="#243B6B">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{
    --ink:#1C2B33; --bg:#EEF1EF; --surface:#FFFFFF;
    --primary:#243B6B; --primary-dark:#182849;
    --accent:#DB8A34; --accent-dark:#B96F22;
    --success:#3D8361; --warning:#C98A2E; --danger:#B23A48;
    --border:#E2E6E4; --muted:#8790A0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  svg{width:18px; height:18px; flex-shrink:0; display:inline-block; vertical-align:middle;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;
    display:flex; flex-direction:column; min-height:100vh;
    overflow-x:hidden;
  }
  button{font-family:inherit; cursor:pointer; border:none;}
  input,select{font-family:inherit;}
  .tabular{font-variant-numeric:tabular-nums; letter-spacing:.01em;}
  a{color:inherit;}

  #header{
    background:linear-gradient(155deg, var(--primary), var(--primary-dark));
    color:#fff; padding:20px 16px 16px; position:sticky; top:0; z-index:30;
    border-radius:0 0 20px 20px; box-shadow:0 6px 18px rgba(24,40,73,.18);
  }
  .header-inner{max-width:460px; margin:0 auto;}
  .header-row{display:flex; align-items:baseline; justify-content:space-between;}
  .header-title{font-size:19px; font-weight:800; letter-spacing:-.01em; margin:0;}
  .header-sub{font-size:11.5px; opacity:.75; font-weight:600;}
  .settings-btn{background:rgba(255,255,255,.14); border-radius:10px; width:32px; height:32px; display:flex; align-items:center; justify-content:center; color:#fff;}
  .header-debt{margin-top:10px; display:flex; align-items:baseline; gap:6px;}
  .header-debt-amount{font-size:28px; font-weight:800; letter-spacing:-.01em;}
  .stat-strip{display:flex; gap:8px; margin-top:12px;}
  .stat-chip{flex:1; background:rgba(255,255,255,.12); border-radius:12px; padding:8px 10px;}
  .stat-chip-label{font-size:10px; opacity:.75; font-weight:600;}
  .stat-chip-value{font-size:15px; font-weight:800; margin-top:2px;}

  #main{flex:1; overflow-y:auto; padding:12px 12px 100px; max-width:460px; width:100%; margin:0 auto;}
  #tabbar{
    position:fixed; bottom:0; left:0; right:0; background:var(--surface);
    border-top:1px solid var(--border); z-index:40;
    padding-bottom:env(safe-area-inset-bottom);
    box-shadow:0 -2px 10px rgba(24,40,73,.05);
  }
  .tabbar-inner{max-width:460px; margin:0 auto; display:grid; grid-template-columns:repeat(5,1fr); padding:6px 6px 4px;}
  .tab-btn{
    background:none; display:flex; flex-direction:column; align-items:center;
    gap:3px; padding:6px 0 6px; color:var(--muted); font-size:10.5px; font-weight:700;
  }
  .tab-btn .tab-icon-wrap{width:38px; height:26px; border-radius:10px; display:flex; align-items:center; justify-content:center;}
  .tab-btn.active .tab-icon-wrap{background:#EFE3D0;}
  .tab-btn.active{color:var(--primary);}
  .tab-btn svg{width:19px; height:19px;}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:13px;
    box-shadow:0 1px 2px rgba(24,40,73,.03), 0 6px 14px rgba(24,40,73,.04);}
  .stack{display:flex; flex-direction:column; gap:10px;}
  .row{display:flex; gap:8px;}
  .row-center{display:flex; align-items:center; gap:8px;}
  .space-between{display:flex; align-items:center; justify-content:space-between;}
  .search-box{
    flex:1; display:flex; align-items:center; gap:8px; background:var(--surface);
    border:1px solid var(--border); border-radius:13px; padding:9px 12px;
  }
  .search-box input{flex:1; border:none; outline:none; font-size:14px; background:transparent;}
  .icon-btn{
    background:var(--accent); color:#fff; border-radius:13px; width:44px;
    display:flex; align-items:center; justify-content:center; box-shadow:0 4px 10px rgba(219,138,52,.3);
  }
  .icon-btn:active{opacity:.85;}
  .btn-primary{
    background:var(--accent); color:#fff; font-weight:700; padding:13px; border-radius:13px;
    width:100%; display:flex; align-items:center; justify-content:center; gap:8px; font-size:14px;
    box-shadow:0 4px 10px rgba(219,138,52,.25);
  }
  .btn-primary:disabled{opacity:.4; box-shadow:none;}
  .btn-primary:active{opacity:.88;}
  .btn-danger{background:var(--danger); box-shadow:0 4px 10px rgba(178,58,72,.25);}
  .btn-secondary{
    background:var(--surface); color:var(--primary); border:1.5px dashed var(--primary); font-weight:700;
    padding:11px; border-radius:13px; width:100%; display:flex; align-items:center;
    justify-content:center; gap:8px; font-size:13.5px;
  }
  .btn-ghost{background:#F2F0EA; color:var(--ink); font-weight:600; padding:10px; border-radius:12px;
    width:100%; display:flex; align-items:center; justify-content:center; gap:6px; font-size:13px;}
  .empty{
    background:var(--surface); border:1.5px dashed #CBD2D8; border-radius:16px; padding:28px 16px; text-align:center;
  }
  .empty svg{width:28px; height:28px; color:#B7C0C6; margin-bottom:6px;}
  .empty-title{font-weight:700; font-size:14px;}
  .empty-sub{font-size:12px; color:var(--muted); margin-top:4px;}

  .stamp{
    width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    flex-shrink:0; font-weight:800; font-size:14px; border:2px solid; position:relative;
  }
  .stamp svg{width:17px; height:17px;}

  .customer-row{display:flex; align-items:center; gap:11px; padding:11px;}
  .customer-name{font-weight:700; font-size:14px;}
  .customer-sub{font-size:11px; color:var(--muted); margin-top:2px;}
  .customer-debt{text-align:left;}
  .customer-debt-amt{font-weight:800;}
  .customer-debt-lbl{font-size:9.5px; color:var(--muted); font-weight:600;}
  .field-label{font-size:11.5px; color:var(--muted); font-weight:700; display:block; margin-bottom:4px; letter-spacing:.01em;}
  select.select-field{
    width:100%; background:transparent; border:none; outline:none; font-size:14px; font-weight:700;
  }
  input.text-field{
    width:100%; background:#FAFBFA; border:1.5px solid var(--border); border-radius:11px;
    padding:10px 12px; font-size:14px; outline:none;
  }
  input.text-field:focus{border-color:var(--primary);}
  .qty-stepper{
    display:flex; align-items:center; gap:6px; background:#FAFBFA; border:1.5px solid var(--border);
    border-radius:11px; padding:5px 7px;
  }
  .qty-stepper button{
    width:24px; height:24px; display:flex; align-items:center; justify-content:center;
    color:var(--primary); font-weight:800; background:none; font-size:16px; border-radius:6px;
  }
  .qty-stepper span{width:22px; text-align:center; font-weight:700; font-size:14px;}
  .line-item{display:flex; align-items:center; gap:8px; padding:11px;}
  .badge{font-size:10px; font-weight:800; padding:3px 9px; border-radius:99px;}
  .badge-invoice{background:#E2E7F0; color:var(--primary);}
  .badge-collect{background:#F3E6D2; color:var(--accent-dark);}
  .badge-return{background:#F3DEE0; color:var(--danger);}
  .modal-overlay{
    position:fixed; inset:0; background:rgba(20,28,40,.45); z-index:50; display:flex; align-items:flex-end;
  }
  .modal-sheet{
    background:var(--surface); width:100%; max-width:460px; margin:0 auto; border-radius:20px 20px 0 0;
    padding:16px; max-height:82vh; display:flex; flex-direction:column; gap:12px; overflow-y:auto;
  }
  .modal-list{overflow-y:auto; display:flex; flex-direction:column; gap:6px;}
  .type-toggle{display:flex; gap:8px;}
  .type-toggle button{
    flex:1; display:flex; align-items:center; justify-content:center; gap:6px; padding:9px;
    border-radius:11px; font-size:13px; font-weight:700; border:1.5px solid var(--border); background:#fff; color:var(--muted);
  }
  .type-toggle button.active{border-color:var(--primary); background:#E2E7F0; color:var(--primary);}
  .type-toggle button svg{width:15px; height:15px;}
  #toast-container{position:fixed; bottom:92px; left:50%; transform:translateX(-50%); z-index:60;}
  .toast{
    background:var(--primary-dark); color:#fff; padding:9px 16px; border-radius:99px; font-size:13px;
    font-weight:700; box-shadow:0 6px 20px rgba(0,0,0,.25);
  }
  .toast.error{background:var(--danger);}
  .alert-box{
    background:#FBF1E1; border:1px solid #ECD8B2; border-radius:13px; padding:10px 12px;
    display:flex; gap:8px; align-items:flex-start; font-size:12px; color:#7A5A1E;
  }
  .alert-box svg{width:16px; height:16px; flex-shrink:0; margin-top:1px; color:var(--warning);}
  .banner-danger{background:#FBEAEA; border:1px solid #EAC6C9; color:#7A2732;}
  .banner-danger svg{color:var(--danger);}
  .num-input{
    flex:1; text-align:center; background:#FAFBFA; border:1.5px solid var(--border); border-radius:11px;
    padding:7px; font-size:14px; font-weight:700; outline:none;
  }
  .icon-btn svg{width:20px; height:20px;}
  .trash-btn{color:#C9CFC7; background:none; padding:4px;}
  .trash-btn:active{color:var(--danger);}
  .trash-btn svg{width:17px; height:17px;}

  .receipt-paper{
    background:#FCFBF8; border-radius:4px; padding:16px 14px; position:relative;
    background-image:
      radial-gradient(circle 6px at 0 0, transparent 6px, #FCFBF8 6.5px),
      radial-gradient(circle 6px at 100% 0, transparent 6px, #FCFBF8 6.5px),
      radial-gradient(circle 6px at 0 100%, transparent 6px, #FCFBF8 6.5px),
      radial-gradient(circle 6px at 100% 100%, transparent 6px, #FCFBF8 6.5px);
    border:1px dashed #D8D2C4;
  }
  .receipt-divider{border-top:1.5px dashed #D8D2C4; margin:10px 0;}
  .receipt-table{display:flex; flex-direction:column; gap:7px;}
  .receipt-row{display:flex; align-items:center; font-size:12px; gap:4px;}
  .receipt-head{font-weight:800; color:var(--muted); font-size:10.5px; text-transform:uppercase; letter-spacing:.03em;}
  .stock-badge{font-size:10.5px; font-weight:800; padding:3px 9px; border-radius:99px; flex-shrink:0;}
  .stock-ok{background:#DEEDE3; color:var(--success);}
  .stock-low{background:#F6E7CC; color:var(--warning);}
  .stock-out{background:#F6DBDD; color:var(--danger);}
  .receive-btn{background:#EFE9DC; color:var(--accent-dark); font-weight:700; font-size:11px; padding:6px 10px; border-radius:9px; display:flex; align-items:center; gap:4px; flex-shrink:0;}
  .call-link{background:#E2E7F0; color:var(--primary); font-weight:700; font-size:12px; padding:8px 10px; border-radius:10px; display:flex; align-items:center; justify-content:center; gap:6px; text-decoration:none; flex:1;}
  .settings-row{display:flex; align-items:center; gap:10px; padding:12px; border-radius:12px; background:#F6F7F5; font-size:13px; font-weight:700;}
  .settings-row svg{color:var(--primary);}
  @media print{
    #header, #tabbar, #toast-container, #main{display:none !important;}
    .modal-overlay{position:static !important; background:none !important; padding:0 !important;}
    .modal-sheet{box-shadow:none !important; border-radius:0 !important; max-height:none !important; margin:0 !important;}
    .no-print{display:none !important;}
  }
</style>
</head>
<body>
  <div id="header"></div>
  <main id="main"></main>
  <div id="tabbar"></div>
  <div id="modal-root"></div>
  <div id="toast-container"></div>
  <input type="file" id="import-file-input" accept="application/json" style="display:none;">

const DB_KEYS = { products:'mandoub_products', customers:'mandoub_customers', history:'mandoub_history' };
function loadDB(key){ try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : []; }catch(e){ return []; } }
function saveDB(key, value){ try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){ toast('حصل خطأ في الحفظ على الجهاز', 'error'); } }

const state = {
  tab: 'dashboard',
  products: loadDB(DB_KEYS.products),
  customers: loadDB(DB_KEYS.customers),
  history: loadDB(DB_KEYS.history),
  cart: {},
  invoiceCustomerId: null,
  invoiceDiscountPercent: 0,
  collectCustomerId: null,
  collectRemaining: {},
  returnCustomerId: null,
  returnQty: {},
  modal: null,
  dashboardQuery: '',
  pickerQuery: '',
  receiveProductId: null,
  previewRecord: null,
  detailCustomerId: null,
};

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function money(n){
  n = Math.round((n + Number.EPSILON) * 100) / 100;
  return n.toLocaleString('ar-EG', { minimumFractionDigits:2, maximumFractionDigits:2 });
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function isToday(iso){
  const d = new Date(iso), n = new Date();
  return d.getFullYear()===n.getFullYear() && d.getMonth()===n.getMonth() && d.getDate()===n.getDate();
}

let toastTimer = null;
function toast(msg, kind){
  clearTimeout(toastTimer);
  document.getElementById('toast-container').innerHTML =
    '<div class="toast ' + (kind==='error'?'error':'') + '">' + escapeHtml(msg) + '</div>';
  toastTimer = setTimeout(()=>{ document.getElementById('toast-container').innerHTML=''; }, 2400);
}

function setProducts(next){ state.products = next; saveDB(DB_KEYS.products, next); }

function cartLines(){
  return Object.entries(state.cart).filter(([,q])=>q>0).map(([pid,qty])=>{
    const p = state.products.find(p=>p.id===pid);
    if(!p) return null;
    return { productId:pid, name:p.name, price:p.price, qty:qty, subtotal: p.price*qty };
  }).filter(Boolean);
}
function setInvoiceCustomer(id){ state.invoiceCustomerId = id; render(); }
function setCartQty(pid, qty){
  const p = state.products.find(p=>p.id===pid);
  const stock = p ? (p.stock || 0) : 0;
  if(qty > stock){
    toast('الكمية المتاحة من ' + p.name + ' هي ' + stock + ' بس', 'error');
    qty = stock;
  }
  state.cart[pid] = Math.max(0, qty);
  render();
}
function onDiscountInput(v){
  let pct = Number(v);
  if(isNaN(pct)) pct = 0;
  pct = Math.min(100, Math.max(0, pct));
  state.invoiceDiscountPercent = pct;
  const lines = cartLines();
  const subtotal = lines.reduce((s,l)=>s+l.subtotal,0);
  const discountAmount = subtotal * pct / 100;
  const total = subtotal - discountAmount;
  document.getElementById('subtotal-display').textContent = money(subtotal);
  document.getElementById('discount-display').textContent = '-' + money(discountAmount);
  document.getElementById('total-display').textContent = money(total) + ' جنيه';
}
function submitInvoice(){
  const customer = state.customers.find(c=>c.id===state.invoiceCustomerId);
  const lines = cartLines();
  const subtotal = lines.reduce((s,l)=>s+l.subtotal,0);
  const pct = state.invoiceDiscountPercent || 0;
  const discountAmount = subtotal * pct / 100;
  const total = subtotal - discountAmount;
  if(!customer){ toast('اختار عميل الأول','error'); return; }
  if(lines.length===0){ toast('ضيف صنف واحد على الأقل','error'); return; }
  for(const l of lines){
    const p = state.products.find(p=>p.id===l.productId);
    const stock = p ? (p.stock || 0) : 0;
    if(l.qty > stock){
      toast('الكمية المتاحة من ' + l.name + ' هي ' + stock + ' بس', 'error');
      return;
    }
  }
  const nextProducts = state.products.map(p=>{
    const l = lines.find(l=>l.productId===p.id);
    return l ? Object.assign({}, p, {stock:(p.stock||0)-l.qty}) : p;
  });
  const nextCustomers = state.customers.map(c=>{
    if(c.id!==customer.id) return c;
    const items = Object.assign({}, c.items||{});
    lines.forEach(l=>{ items[l.productId] = (items[l.productId]||0) + l.qty; });
    return Object.assign({}, c, {items:items, debt:(c.debt||0)+total});
  });
  setProducts(nextProducts);
  setCustomers(nextCustomers);
  const record = { id:uid(), type:'invoice', customerId:customer.id, customerName:customer.name, date:new Date().toISOString(), lines:lines, subtotal:subtotal, discountPercent:pct, discountAmount:discountAmount, total:total };
  setHistory([record].concat(state.history));
  state.cart = {};
  state.invoiceDiscountPercent = 0;
  state.previewRecord = record;
  state.modal = 'receipt';
  render();
}

function customersWithStock(){
  return state.customers.filter(c=>Object.values(c.items||{}).some(q=>q>0));
}
function renderCollectTab(){
  if(state.customers.length===0){
    return emptyState(ICONS.wallet, 'محتاج عملاء الأول', 'ضيف عميل وسجله فاتورة الأول', null, '');
  }

  if(withStock.length===0){
    return emptyState(ICONS.wallet, 'مفيش بضاعة عند حد دلوقتي', 'كل العملاء رصيدهم صفر، مفيش حاجة تتحصل', null, '');
  }
  if(!state.collectCustomerId || !withStock.find(c=>c.id===state.collectCustomerId)){
    state.collectCustomerId = withStock[0].id;
    state.collectRemaining = {};
  }
  const customer = state.customers.find(c=>c.id===state.collectCustomerId);
  const lines = collectLines(customer);
  const total = lines.reduce((s,l)=>s+l.value,0);

  return '<div class="stack">' +
    '<div class="card">' +
      '<span class="field-label">العميل</span>' +
      '<select class="select-field" onchange="setCollectCustomer(this.value)">' +
        withStock.map(c=>'<option value="' + c.id + '" ' + (c.id===customer.id?'selected':'') + '>' + escapeHtml(c.name) + '</option>').join('') +
      '</select>' +
    '</div>' +
    '<div class="alert-box">' + ICONS.alert + '<div>اكتب الرصيد الفعلي الموجود عند العميل دلوقتي لكل صنف، والبرنامج هيحسبلك اللي اتباع واللي المفروض تحصله.</div></div>' +
    '<div class="stack" id="collect-lines">' + lines.map(l=>renderCollectLineHTML(l)).join('') + '</div>' +
    '<div class="card space-between">' +
      '<span style="font-size:13px;color:var(--muted);font-weight:700;">المبلغ المطلوب تحصيله</span>' +
      '<span id="collect-total" style="font-size:18px;font-weight:800;color:var(--primary);" class="tabular">' + money(total) + ' جنيه</span>' +
    '</div>' +
    '<button class="btn-primary" onclick="confirmCollection()">' + ICONS.check + 'تأكيد التحصيل</button>' +
  '</div>';
}
function collectLines(customer){
  return Object.entries(customer.items||{}).filter(([,q])=>q>0).map(([pid,currentQty])=>{
    const p = state.products.find(p=>p.id===pid);
    const rem = state.collectRemaining[pid] !== undefined ? state.collectRemaining[pid] : currentQty;
    const sold = Math.max(0, currentQty - rem);
    return { productId:pid, name: p ? p.name : 'صنف محذوف', price: p ? p.price : 0, currentQty:currentQty, remaining:rem, sold:sold, value: sold * (p ? p.price : 0) };
  });
}
function renderCollectLineHTML(l){
  return '<div class="card" id="collect-row-' + l.productId + '">' +
    '<div class="space-between" style="margin-bottom:8px;">' +
      '<div>' +
        '<div style="font-size:14px;font-weight:700;">' + escapeHtml(l.name) + '</div>' +
        '<div style="font-size:11px;color:var(--muted);">عنده ' + l.currentQty + ' × ' + money(l.price) + ' جنيه</div>' +
      '</div>' +
      '<div style="text-align:left;">' +
        '<div style="font-size:11px;color:var(--muted);">المباع</div>' +
        '<div class="tabular" id="sold-' + l.productId + '" style="font-weight:800;color:' + (l.sold>0?'var(--primary)':'#B7C0B5') + ';">' + l.sold + '</div>' +
      '</div>' +
    '</div>' +
    '<div class="row-center">' +
      '<label style="font-size:12px;color:var(--muted);flex-shrink:0;">الرصيد الحالي عنده</label>' +
      '<input type="number" min="0" max="' + l.currentQty + '" class="num-input" id="remaining-' + l.productId + '" value="' + l.remaining + '" oninput="onRemainingInput(\'' + l.productId + '\', ' + l.currentQty + ', ' + l.price + ')">' +
      '<div style="width:80px;text-align:left;font-size:14px;font-weight:800;flex-shrink:0;" class="tabular" id="value-' + l.productId + '">' + money(l.value) + '</div>' +
    '</div>' +
  '</div>';
}
function setCollectCustomer(id){
  state.collectCustomerId = id;
  state.collectRemaining = {};
  render();
}
function onRemainingInput(pid, currentQty, price){
  let v = Number(document.getElementById('remaining-'+pid).value);
  if(isNaN(v)) v = 0;
  v = Math.min(Math.max(0, v), currentQty);
  state.collectRemaining[pid] = v;
  const sold = Math.max(0, currentQty - v);
  const value = sold * price;
  document.getElementById('sold-'+pid).textContent = sold;
  document.getElementById('sold-'+pid).style.color = sold > 0 ? 'var(--primary)' : '#B7C0B5';
  document.getElementById('value-'+pid).textContent = money(value);
  const customer = state.customers.find(c=>c.id===state.collectCustomerId);
  const total = collectLines(customer).reduce((s,l)=>s+l.value,0);
  document.getElementById('collect-total').textContent = money(total) + ' جنيه';
}
function confirmCollection(){
  const customer = state.customers.find(c=>c.id===state.collectCustomerId);
  const lines = collectLines(customer);
  const total = lines.reduce((s,l)=>s+l.value,0);
  if(total <= 0){ toast('مفيش مبلغ للتحصيل، راجع الأرصدة', 'error'); return; }
  const nextCustomers = state.customers.map(c=>{
    if(c.id!==customer.id) return c;
    const items = Object.assign({}, c.items);
    lines.forEach(l=>{ items[l.productId] = l.remaining; });
    return Object.assign({}, c, {items:items, debt: Math.max(0, (c.debt||0)-total)});
  });
  setCustomers(nextCustomers);
  const record = { id:uid(), type:'collect', customerId:customer.id, customerName:customer.name, date:new Date().toISOString(), lines: lines.filter(l=>l.sold>0), total:total };
  setHistory([record].concat(state.history));
  state.collectRemaining = {};
  state.previewRecord = record;
  state.modal = 'receipt';
  render();
}

      '<div class="stack" id="return-lines">' + lines.map(l=>
        '<div class="card" id="return-row-' + l.productId + '">' +
          '<div class="space-between" style="margin-bottom:8px;">' +

              '<div style="font-size:11px;color:var(--muted);">عنده ' + l.currentQty + ' × ' + money(l.price) + ' جنيه</div>' +
            '</div>' +
          '</div>' +
          '<div class="row-center">' +
            '<label style="font-size:12px;color:var(--muted);flex-shrink:0;">الكمية المرتجعة</label>' +
            '<input type="number" min="0" max="' + l.currentQty + '" class="num-input" id="return-qty-' + l.productId + '" value="' + l.qty + '" oninput="onReturnQtyInput(\'' + l.productId + '\', ' + l.currentQty + ', ' + l.price + ')">' +
            '<div style="width:80px;text-align:left;font-size:14px;font-weight:800;flex-shrink:0;" class="tabular" id="return-amount-' + l.productId + '">' + money(l.amount) + '</div>' +

    '</div>' +
  '</div>';

function onReturnQtyInput(pid, currentQty, price){
  let v = Number(document.getElementById('return-qty-'+pid).value);
  if(isNaN(v)) v = 0;
  v = Math.min(Math.max(0, v), currentQty);
  state.returnQty[pid] = v;
  const amount = v * price;
  document.getElementById('return-amount-'+pid).textContent = money(amount);
  const customer = state.customers.find(c=>c.id===state.returnCustomerId);
  const total = returnLines(customer).reduce((s,l)=>s+l.amount,0);
  document.getElementById('return-total').textContent = money(total) + ' جنيه';
}
function confirmReturn(){
  const customer = state.customers.find(c=>c.id===state.returnCustomerId);
  const lines = returnLines(customer).filter(l=>l.qty>0);
  const total = lines.reduce((s,l)=>s+l.amount,0);
  if(lines.length===0){ toast('حدد كمية المرتجع الأول', 'error'); return; }
  const nextCustomers = state.customers.map(c=>{
    if(c.id!==customer.id) return c;
    const items = Object.assign({}, c.items);
    lines.forEach(l=>{ items[l.productId] = Math.max(0, (items[l.productId]||0) - l.qty); });
    return Object.assign({}, c, {items:items, debt: Math.max(0, (c.debt||0)-total)});
  });
  const nextProducts = state.products.map(p=>{
    const l = lines.find(l=>l.productId===p.id);
    return l ? Object.assign({}, p, {stock:(p.stock||0)+l.qty}) : p;
  });
  setCustomers(nextCustomers);
  setProducts(nextProducts);
  const record = { id:uid(), type:'return', customerId:customer.id, customerName:customer.name, date:new Date().toISOString(), lines:lines, total:total };
  setHistory([record].concat(state.history));
  state.returnQty = {};
  state.previewRecord = record;
  state.modal = 'receipt';
  render();
}

      '<button class="settings-row" onclick="exportBackup()">' + ICONS.download + '<span style="flex:1;text-align:right;">تصدير نسخة احتياطية</span></button>' +
      '<button class="settings-row" onclick="document.getElementById(\'import-file-input\').click()">' + ICONS.upload + '<span style="flex:1;text-align:right;">استيراد نسخة احتياطية</span></button>' +
      '<button class="settings-row" style="background:#FBEAEA;color:var(--danger);" onclick="clearAllData()">' + ICONS.trash + '<span style="flex:1;text-align:right;color:var(--danger);">مسح كل البيانات</span></button>' +
      '<div class="empty-sub" style="text-align:center;">البيانات محفوظة على الجهاز ده بس. صدّر نسخة احتياطية بانتظام عشان متفقدش بياناتك.</div>' +
    '</div>' +
  '</div>';
}
function exportBackup(){
  const payload = { products: state.products, customers: state.customers, history: state.history, exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = 'mandoub-backup-' + stamp + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  toast('اتنزلت النسخة الاحتياطية');
}
document.getElementById('import-file-input').addEventListener('change', function(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(evt){
    try{
      const data = JSON.parse(evt.target.result);
      if(!Array.isArray(data.products) || !Array.isArray(data.customers) || !Array.isArray(data.history)){
        toast('الملف ده مش نسخة احتياطية صحيحة', 'error');
        return;
      }
      setProducts(data.products);
      setCustomers(data.customers);
      setHistory(data.history);
      state.modal = null;
      render();
      toast('اترجعت البيانات بنجاح');
    }catch(err){
      toast('حصل خطأ في قراءة الملف', 'error');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});
function clearAllData(){
  if(!confirm('متأكد إنك عايز تمسح كل البيانات؟ الإجراء ده نهائي.')) return;
  setProducts([]);
  setCustomers([]);
  setHistory([]);
  state.modal = null;
  render();
  toast('اتمسحت كل البيانات');
}

render();

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>
</body>
</html>
